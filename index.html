<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkTrack</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">
  <link rel="stylesheet" href="css/app.css">
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<div class="app">
  <!-- ── Sidebar ── -->
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">W</div>
      <div>
        <div class="sidebar-logo-text">WorkTrack</div>
        <div class="sidebar-logo-sub">Gestión de horas</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Menú</div>

      <a class="nav-link" data-page="dashboard" onclick="window.goTo('dashboard')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span class="nav-label">Dashboard</span>
      </a>

      <a class="nav-link" data-page="projects" onclick="window.goTo('projects')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="nav-label">Proyectos</span>
      </a>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-version">v1.0 MVP</div>
    </div>
  </nav>

  <!-- ── Main ── -->
  <main class="main">
    <div id="app-content">
      <div class="loading"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<!-- ── Modal ── -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button id="modal-close" class="modal-close" title="Cerrar">&times;</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<!-- ── Toasts ── -->
<div id="toast-container" class="toast-container"></div>

<!-- ── Config (credenciales Supabase) ── -->
<script src="config.js"></script>

<!-- ── App ── -->
<script type="module" src="js/app.js"></script>

</body>
</html>
